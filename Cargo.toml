[package]
name = "stock"
version = "0.1.0"
edition = "2024"

[features]
# Times every stage of an order's round trip (milestone 25 part 1). Off by default, so the normal
# build carries none of it.
stage-timing = []

[dependencies]
# `ws`: the market-data process's WebSocket feed (milestone 26). It adds tokio-tungstenite.
axum = { version = "0.8.9", features = ["ws"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
bcrypt = "0.19.1"
serde_json = "1.0.150"
memmap2 = "0.9.11"
crc = "3.4.0"
hdrhistogram = { version = "7.5", default-features = false }
# The HTTP client of `--http-bench`. All three are already in the tree through axum; these lines
# turn on hyper's client side, which adds only `want` and `try-lock` to Cargo.lock.
hyper = { version = "1.10.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1.3"
# WebSocket clients for `--feed-bench` (milestone 26 part 3) and the feed tests: the same versions
# axum's `ws` feature already brings in, so they add nothing to Cargo.lock.
tokio-tungstenite = "0.29"
futures-util = "0.3"
